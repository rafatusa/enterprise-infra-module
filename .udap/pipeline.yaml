version: 1
name: enterprise-infra-module
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 15
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Install tflint
        run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: tflint init
        run: tflint --init --config="$(pwd)/.tflint.hcl"
      - name: Terraform format check
        run: terraform fmt -check -recursive infra/modules/
      - name: Lint AWS modules
        run: |
          for dir in infra/modules/aws/*/; do
            echo "Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done
      - name: Lint Azure modules
        run: |
          for dir in infra/modules/azure/*/; do
            echo "Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done

  - id: security
    kind: security
    needs: []
    timeout_minutes: 20
    steps:
      - name: Install checkov
        run: pip install checkov
      - name: Checkov AWS modules
        run: checkov -d infra/modules/aws --soft-fail
      - name: Checkov Azure modules
        run: checkov -d infra/modules/azure --soft-fail
      - name: Install tfsec
        run: |
          wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
      - name: tfsec modules
        run: tfsec infra/modules --soft-fail

  - id: provision
    kind: provision
    needs: [lint, security]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -input=false
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Install Ansible
        run: pip install ansible
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Run Ansible playbook
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          ansible-playbook -i "$HOST," \
            --private-key ~/.ssh/deploy_key \
            -u ${{ secrets.SSH_USER }} \
            ansible/playbook.yml

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Check module structure
        run: |
          echo "=== AWS modules ==="
          for mod in infra/modules/aws/*/; do
            [ -f "${mod}main.tf" ]      && echo "OK ${mod}main.tf"      || (echo "MISSING ${mod}main.tf" && exit 1)
            [ -f "${mod}variables.tf" ] && echo "OK ${mod}variables.tf" || (echo "MISSING ${mod}variables.tf" && exit 1)
            [ -f "${mod}outputs.tf" ]   && echo "OK ${mod}outputs.tf"   || (echo "MISSING ${mod}outputs.tf" && exit 1)
          done
          echo "=== Azure modules ==="
          for mod in infra/modules/azure/*/; do
            [ -f "${mod}main.tf" ]      && echo "OK ${mod}main.tf"      || (echo "MISSING ${mod}main.tf" && exit 1)
            [ -f "${mod}variables.tf" ] && echo "OK ${mod}variables.tf" || (echo "MISSING ${mod}variables.tf" && exit 1)
            [ -f "${mod}outputs.tf" ]   && echo "OK ${mod}outputs.tf"   || (echo "MISSING ${mod}outputs.tf" && exit 1)
          done
      - name: Get instance IP
        id: get_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: SSH connectivity check
        env:
          HOST: ${{ steps.get_ip.outputs.ip }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.SSH_USER }}@$HOST \
            "echo 'SSH OK' && uptime"

rollback:
  strategy: manual

pipelines:
  - id: nightly-scan
    stages:
      - id: deep-security
        kind: security
        needs: []
        timeout_minutes: 30
        steps:
          - name: Install tools
            run: pip install checkov
          - name: Full checkov scan
            run: |
              mkdir -p reports
              checkov -d infra/modules
          - name: Install tfsec
            run: |
              wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
              chmod +x /usr/local/bin/tfsec
          - name: Full tfsec scan
            run: tfsec infra/modules
      - id: generate-docs
        kind: custom
        needs: [deep-security]
        timeout_minutes: 20
        steps:
          - name: Install terraform-docs
            run: |
              wget -q https://github.com/terraform-docs/terraform-docs/releases/download/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
              tar -xzf terraform-docs-v0.18.0-linux-amd64.tar.gz
              mv terraform-docs /usr/local/bin/
          - name: Generate AWS module docs
            run: |
              for mod in infra/modules/aws/*/; do
                terraform-docs markdown table --output-file README.md "$mod"
              done
          - name: Generate Azure module docs
            run: |
              for mod in infra/modules/azure/*/; do
                terraform-docs markdown table --output-file README.md "$mod"
              done
