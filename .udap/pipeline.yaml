version: 1
name: enterprise-infra-module
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 15
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Install tflint
        run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: Terraform format check
        run: terraform fmt -check -recursive infra/modules/
      - name: tflint init
        run: tflint --init --config="$(pwd)/.tflint.hcl"
      - name: Lint AWS modules
        run: |
          for dir in infra/modules/aws/*/; do
            echo "==> Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done
      - name: Lint Azure modules
        run: |
          for dir in infra/modules/azure/*/; do
            echo "==> Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done

  - id: security
    kind: security
    needs: []
    timeout_minutes: 20
    steps:
      - name: Install checkov
        run: pip install checkov
      - name: Checkov AWS modules
        run: checkov -d infra/modules/aws --soft-fail
      - name: Checkov Azure modules
        run: checkov -d infra/modules/azure --soft-fail
      - name: Install tfsec
        run: |
          wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
      - name: tfsec modules
        run: tfsec infra/modules --soft-fail

  - id: validate
    kind: provision
    needs: [lint, security]
    timeout_minutes: 20
    env:
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform init (no backend - validation only)
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  - id: docs-check
    kind: configure
    needs: [validate]
    timeout_minutes: 10
    steps:
      - name: Verify module file structure
        run: |
          missing=0
          for mod in infra/modules/aws/*/ infra/modules/azure/*/; do
            [ -d "$mod" ] || continue
            for f in main.tf variables.tf outputs.tf README.md; do
              if [ ! -f "${mod}${f}" ]; then
                echo "MISSING: ${mod}${f}"
                missing=1
              fi
            done
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required module files are missing."
            exit 1
          fi
          echo "All modules have main.tf, variables.tf, outputs.tf, and README.md."

  - id: verify
    kind: verify
    needs: [docs-check]
    timeout_minutes: 5
    steps:
      - name: All checks passed
        run: |
          echo "============================================"
          echo " enterprise-infra-module: all checks passed"
          echo "  - Lint    : OK"
          echo "  - Security: OK"
          echo "  - Validate: OK"
          echo "  - Docs    : OK"
          echo "============================================"
          echo "Modules are ready for consumption."
          echo "To release a new version, update the VERSION"
          echo "file and trigger the release workflow."

rollback:
  strategy: none

destroy:
  steps:
    - name: No infrastructure to destroy
      run: |
        echo "This is a Terraform module library repo."
        echo "No infrastructure is deployed from this repo directly."
        echo "Consumers own their own state and destroy their own resources."

pipelines:
  - id: nightly-scan
    stages:
      - id: deep-security
        kind: security
        needs: []
        timeout_minutes: 30
        steps:
          - name: Install tools
            run: pip install checkov
          - name: Full checkov scan
            run: checkov -d infra/modules
          - name: Install tfsec
            run: |
              wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
              chmod +x /usr/local/bin/tfsec
          - name: Full tfsec scan
            run: tfsec infra/modules
      - id: generate-docs
        kind: custom
        needs: [deep-security]
        timeout_minutes: 20
        steps:
          - name: Install terraform-docs
            run: |
              wget -q https://github.com/terraform-docs/terraform-docs/releases/download/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
              tar -xzf terraform-docs-v0.18.0-linux-amd64.tar.gz
              mv terraform-docs /usr/local/bin/
          - name: Generate AWS module docs
            run: |
              for mod in infra/modules/aws/*/; do
                terraform-docs markdown table --output-file README.md "$mod"
              done
          - name: Generate Azure module docs
            run: |
              for mod in infra/modules/azure/*/; do
                terraform-docs markdown table --output-file README.md "$mod"
              done

  - id: release
    stages:
      - id: tag-and-release
        kind: custom
        timeout_minutes: 10
        steps:
          - name: Read VERSION
            id: read_version
            run: |
              VERSION=$(cat VERSION)
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Releasing v${VERSION}"
          - name: Check tag does not already exist
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "v${VERSION}"; then
                echo "ERROR: Tag v${VERSION} already exists."
                echo "Bump the VERSION file and re-trigger this workflow."
                exit 1
              fi
              echo "Tag v${VERSION} is new. Proceeding."
          - name: Configure git identity
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
          - name: Create and push annotated tag
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              git tag -a "v${VERSION}" -m "Release v${VERSION}"
              git push origin "v${VERSION}"
          - name: Create GitHub Release
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              gh release create "v${VERSION}" \
                --title "v${VERSION}" \
                --generate-notes \
                --latest
