version: 1
name: enterprise-infra-module
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 20
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Install tflint
        run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform/
      - name: tflint init
        run: tflint --init --config="$(pwd)/.tflint.hcl"
      - name: Lint Terraform modules
        run: |
          for dir in infra/terraform/modules/aws/*/ infra/terraform/modules/azure/*/; do
            [ -d "$dir" ] || continue
            echo "==> Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done
      - name: Lint Terraform packages
        run: |
          for dir in infra/terraform/packages/aws/*/ infra/terraform/packages/azure/*/; do
            [ -d "$dir" ] || continue
            echo "==> Linting $dir"
            tflint --chdir="$dir" --config="$(pwd)/.tflint.hcl"
          done

  - id: security
    kind: security
    needs: []
    timeout_minutes: 20
    steps:
      - name: Install checkov
        run: pip install checkov
      - name: Checkov Terraform tree
        run: checkov -d infra/terraform --soft-fail
      - name: Install tfsec
        run: |
          wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
          chmod +x /usr/local/bin/tfsec
      - name: tfsec Terraform tree
        run: tfsec infra/terraform --soft-fail

  - id: validate
    kind: provision
    needs: [lint, security]
    timeout_minutes: 25
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Validate every module and package
        run: |
          rc=0
          for dir in infra/terraform/modules/aws/*/ \
                     infra/terraform/modules/azure/*/ \
                     infra/terraform/packages/aws/*/ \
                     infra/terraform/packages/azure/*/; do
            [ -d "$dir" ] || continue
            echo "==> terraform validate $dir"
            if ! terraform -chdir="$dir" init -backend=false -input=false >/dev/null; then
              echo "INIT FAILED: $dir"
              rc=1
              continue
            fi
            if ! terraform -chdir="$dir" validate; then
              echo "VALIDATE FAILED: $dir"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "One or more Terraform directories failed validation."
            exit 1
          fi
          echo "All Terraform modules and packages validated."

  - id: docs-check
    kind: configure
    needs: [validate]
    timeout_minutes: 10
    steps:
      - name: Verify Terraform file structure
        run: |
          missing=0
          for d in infra/terraform/modules/aws/*/ \
                   infra/terraform/modules/azure/*/ \
                   infra/terraform/packages/aws/*/ \
                   infra/terraform/packages/azure/*/; do
            [ -d "$d" ] || continue
            for f in main.tf variables.tf outputs.tf README.md; do
              if [ ! -f "${d}${f}" ]; then
                echo "MISSING: ${d}${f}"
                missing=1
              fi
            done
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required files are missing."
            exit 1
          fi
          echo "All modules and packages have main.tf, variables.tf, outputs.tf, README.md."
      - name: Verify Pulumi tree layout
        run: |
          missing=0
          for d in infra/pulumi/modules/aws/*/ \
                   infra/pulumi/modules/azure/*/ \
                   infra/pulumi/packages/aws/*/ \
                   infra/pulumi/packages/azure/*/; do
            [ -d "$d" ] || continue
            if ! ls "$d"*.go >/dev/null 2>&1; then
              echo "MISSING: no .go files in $d"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more Pulumi components have no Go sources."
            exit 1
          fi
          echo "Pulumi tree layout OK."

  - id: verify
    kind: verify
    needs: [docs-check]
    timeout_minutes: 5
    steps:
      - name: All checks passed
        run: |
          echo "============================================"
          echo " enterprise-infra-module: all checks passed"
          echo "  - Lint     : OK"
          echo "  - Security : OK"
          echo "  - Validate : OK"
          echo "  - Structure: OK"
          echo "============================================"
          echo "Layout: infra/{terraform,pulumi}/{modules,packages}/{aws,azure}"
          echo "Modules and packages are ready for consumption."
          echo "To release, update VERSION and run the release workflow."

rollback:
  strategy: none

destroy:
  steps:
    - name: No infrastructure to destroy
      run: |
        echo "This is an infrastructure module library repo."
        echo "No infrastructure is deployed from this repo directly."
        echo "Consumers own their own state and destroy their own resources."

pipelines:
  - id: pulumi-ci
    stages:
      - id: go-lint
        kind: lint
        needs: []
        timeout_minutes: 15
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: gofmt check
            working-directory: infra/pulumi
            run: |
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then
                echo "These files are not gofmt-formatted:"
                echo "$unformatted"
                exit 1
              fi
              echo "gofmt clean."
          - name: go vet
            working-directory: infra/pulumi
            run: go vet ./...
          - name: staticcheck
            working-directory: infra/pulumi
            run: |
              go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
              "$(go env GOPATH)/bin/staticcheck" ./...

      - id: go-build
        kind: build
        needs: [go-lint]
        timeout_minutes: 15
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: go build
            working-directory: infra/pulumi
            run: go build ./...

      - id: go-security
        kind: security
        needs: [go-build]
        timeout_minutes: 15
        steps:
          - name: Setup Go
            uses: actions/setup-go@v5
            with:
              go-version: "1.22"
          - name: gosec
            working-directory: infra/pulumi
            run: |
              go install github.com/securego/gosec/v2/cmd/gosec@latest
              "$(go env GOPATH)/bin/gosec" ./...

  - id: nightly-scan
    stages:
      - id: deep-security
        kind: security
        needs: []
        timeout_minutes: 30
        steps:
          - name: Install checkov
            run: pip install checkov
          - name: Full checkov scan
            run: checkov -d infra/terraform
          - name: Install tfsec
            run: |
              wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64
              chmod +x /usr/local/bin/tfsec
          - name: Full tfsec scan
            run: tfsec infra/terraform
      - id: generate-docs
        kind: custom
        needs: [deep-security]
        timeout_minutes: 20
        steps:
          - name: Install terraform-docs
            run: |
              wget -q https://github.com/terraform-docs/terraform-docs/releases/download/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
              tar -xzf terraform-docs-v0.18.0-linux-amd64.tar.gz
              mv terraform-docs /usr/local/bin/
          - name: Generate module and package docs
            run: |
              for d in infra/terraform/modules/aws/*/ \
                       infra/terraform/modules/azure/*/ \
                       infra/terraform/packages/aws/*/ \
                       infra/terraform/packages/azure/*/; do
                [ -d "$d" ] || continue
                terraform-docs markdown table --output-file README.md "$d"
              done

  - id: release
    stages:
      - id: tag-and-release
        kind: custom
        timeout_minutes: 10
        steps:
          - name: Read VERSION
            id: read_version
            run: |
              VERSION=$(cat VERSION)
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Releasing v${VERSION}"
          - name: Check tag does not already exist
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "v${VERSION}"; then
                echo "ERROR: Tag v${VERSION} already exists."
                echo "Bump the VERSION file and re-trigger this workflow."
                exit 1
              fi
              echo "Tag v${VERSION} is new. Proceeding."
          - name: Configure git identity
            run: |
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
          - name: Create and push annotated tag
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              git tag -a "v${VERSION}" -m "Release v${VERSION}"
              git push origin "v${VERSION}"
          - name: Create GitHub Release
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              VERSION=$(cat VERSION)
              gh release create "v${VERSION}" \
                --title "v${VERSION}" \
                --generate-notes \
                --latest
