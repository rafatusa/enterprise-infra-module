---
- name: Configure enterprise-infra-module EC2 host
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_user: deploy
    packages:
      - git
      - curl
      - unzip
      - jq
      - awscli

  tasks:
    - name: Wait for system to be ready
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      delay: 10
      register: apt_update
      until: apt_update is succeeded

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Ensure /opt/app directory exists
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Write system info marker
      ansible.builtin.copy:
        dest: /opt/app/deploy_info.txt
        content: |
          Deployed by: enterprise-infra-module
          Date: {{ ansible_date_time.iso8601 }}
          Host: {{ inventory_hostname }}
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
