name: pulumi-ci
'on':
  workflow_dispatch: {}
jobs:
  go_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: pulumi/go.mod
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    - name: go vet
      run: 'cd pulumi

        go vet ./...

        '
    - name: staticcheck
      run: 'cd pulumi

        staticcheck ./...

        '
    - name: gofmt check
      run: "cd pulumi\nUNFORMATTED=$(gofmt -l .)\nif [ -n \"$UNFORMATTED\" ]; then\n\
        \  echo \"The following files need formatting:\"\n  echo \"$UNFORMATTED\"\n\
        \  exit 1\nfi\necho \"All Go files are formatted correctly.\"\n"
  go_test:
    runs-on: ubuntu-latest
    needs:
    - go_lint
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: pulumi/go.mod
    - name: Download dependencies
      run: 'cd pulumi

        go mod download

        '
    - name: go build (compile check)
      run: 'cd pulumi

        go build ./...

        '
    - name: go test
      run: 'cd pulumi

        go test ./... -v -timeout 120s || true

        '
  go_security:
    runs-on: ubuntu-latest
    needs:
    - go_test
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: pulumi/go.mod
    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest
    - name: Run gosec
      run: 'cd pulumi

        gosec -fmt=text -severity=medium ./... || true

        '
    - name: Install nancy
      run: go install github.com/sonatype-nexus-community/nancy@latest
    - name: Run nancy
      run: 'cd pulumi

        go list -json -deps ./... | nancy sleuth || true

        '
