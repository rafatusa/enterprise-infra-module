name: create-release
'on':
  workflow_dispatch: {}
jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Configure git
      run: 'git config user.name "github-actions[bot]"

        git config user.email "github-actions[bot]@users.noreply.github.com"

        '
    - name: Extract version from tag
      run: "VERSION=\"${GITHUB_REF#refs/tags/}\"\nif ! echo \"$VERSION\" | grep -qE\
        \ '^v[0-9]+\\.[0-9]+\\.[0-9]+$'; then\n  echo \"ERROR: tag must match vX.Y.Z\
        \ (e.g. v1.1.0)\"\n  exit 1\nfi\necho \"VERSION=$VERSION\" >> $GITHUB_ENV\n\
        echo \"Releasing version: $VERSION\"\n"
    - name: Create GitHub Release
      run: "gh release create \"$VERSION\" \\\n  --title \"terraform-enterprise-modules\
        \ $VERSION\" \\\n  --notes \"See CHANGELOG.md for full release notes.\" \\\
        \n  --latest\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
