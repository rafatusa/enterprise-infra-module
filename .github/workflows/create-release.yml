name: create-release
'on':
  workflow_dispatch: {}
jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Configure git
      run: 'git config user.name "github-actions[bot]"

        git config user.email "github-actions[bot]@users.noreply.github.com"

        '
    - name: Validate version format
      run: "VERSION=\"${{ github.event.inputs.version }}\"\nif ! echo \"$VERSION\"\
        \ | grep -qE '^v[0-9]+\\.[0-9]+\\.[0-9]+$'; then\n  echo \"ERROR: version\
        \ must match vX.Y.Z (e.g. v1.1.0)\"\n  exit 1\nfi\necho \"Version: $VERSION\"\
        \n"
    - name: Check tag does not already exist
      run: "VERSION=\"${{ github.event.inputs.version }}\"\nif git ls-remote --tags\
        \ origin \"$VERSION\" | grep -q \"$VERSION\"; then\n  echo \"ERROR: tag $VERSION\
        \ already exists on remote.\"\n  exit 1\nfi\n"
    - name: Create and push tag
      run: "VERSION=\"${{ github.event.inputs.version }}\"\ngit tag -a \"$VERSION\"\
        \ -m \"Release $VERSION \u2014 terraform-enterprise-modules\"\ngit push origin\
        \ \"$VERSION\"\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create GitHub Release
      run: "VERSION=\"${{ github.event.inputs.version }}\"\ngh release create \"$VERSION\"\
        \ \\\n  --title \"terraform-enterprise-modules $VERSION\" \\\n  --notes \"\
        See CHANGELOG.md for full release notes.\" \\\n  --latest\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
