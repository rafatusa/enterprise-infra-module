# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Install tflint
      run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh
        | bash
    - name: Terraform format check
      run: terraform fmt -check -recursive infra/terraform/
    - name: tflint init
      run: tflint --init --config="$(pwd)/.tflint.hcl"
    - name: Lint Terraform modules
      run: "for dir in infra/terraform/modules/aws/*/ infra/terraform/modules/azure/*/;\
        \ do\n  [ -d \"$dir\" ] || continue\n  echo \"==> Linting $dir\"\n  tflint\
        \ --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
    - name: Lint Terraform packages
      run: "for dir in infra/terraform/packages/aws/*/ infra/terraform/packages/azure/*/;\
        \ do\n  [ -d \"$dir\" ] || continue\n  echo \"==> Linting $dir\"\n  tflint\
        \ --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install checkov
      run: pip install checkov
    - name: Checkov Terraform tree
      run: checkov -d infra/terraform --soft-fail
    - name: Install tfsec
      run: 'wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64

        chmod +x /usr/local/bin/tfsec

        '
    - name: tfsec Terraform tree
      run: tfsec infra/terraform --soft-fail
  validate:
    runs-on: ubuntu-latest
    needs:
    - lint
    - security
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Validate every module and package
      run: "rc=0\nfor dir in infra/terraform/modules/aws/*/ \\\n           infra/terraform/modules/azure/*/\
        \ \\\n           infra/terraform/packages/aws/*/ \\\n           infra/terraform/packages/azure/*/;\
        \ do\n  [ -d \"$dir\" ] || continue\n  echo \"==> terraform validate $dir\"\
        \n  if ! terraform -chdir=\"$dir\" init -backend=false -input=false >/dev/null;\
        \ then\n    echo \"INIT FAILED: $dir\"\n    rc=1\n    continue\n  fi\n  if\
        \ ! terraform -chdir=\"$dir\" validate; then\n    echo \"VALIDATE FAILED:\
        \ $dir\"\n    rc=1\n  fi\ndone\nif [ \"$rc\" -ne 0 ]; then\n  echo \"One or\
        \ more Terraform directories failed validation.\"\n  exit 1\nfi\necho \"All\
        \ Terraform modules and packages validated.\"\n"
  docs-check:
    runs-on: ubuntu-latest
    needs:
    - validate
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Verify Terraform file structure
      run: "missing=0\nfor d in infra/terraform/modules/aws/*/ \\\n         infra/terraform/modules/azure/*/\
        \ \\\n         infra/terraform/packages/aws/*/ \\\n         infra/terraform/packages/azure/*/;\
        \ do\n  [ -d \"$d\" ] || continue\n  for f in main.tf variables.tf outputs.tf\
        \ README.md; do\n    if [ ! -f \"${d}${f}\" ]; then\n      echo \"MISSING:\
        \ ${d}${f}\"\n      missing=1\n    fi\n  done\ndone\nif [ \"$missing\" -eq\
        \ 1 ]; then\n  echo \"One or more required files are missing.\"\n  exit 1\n\
        fi\necho \"All modules and packages have main.tf, variables.tf, outputs.tf,\
        \ README.md.\"\n"
    - name: Verify Pulumi tree layout
      run: "missing=0\nfor d in infra/pulumi/modules/aws/*/ \\\n         infra/pulumi/modules/azure/*/\
        \ \\\n         infra/pulumi/packages/aws/*/ \\\n         infra/pulumi/packages/azure/*/;\
        \ do\n  [ -d \"$d\" ] || continue\n  if ! ls \"$d\"*.go >/dev/null 2>&1; then\n\
        \    echo \"MISSING: no .go files in $d\"\n    missing=1\n  fi\ndone\nif [\
        \ \"$missing\" -eq 1 ]; then\n  echo \"One or more Pulumi components have\
        \ no Go sources.\"\n  exit 1\nfi\necho \"Pulumi tree layout OK.\"\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - docs-check
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: All checks passed
      run: 'echo "============================================"

        echo " enterprise-infra-module: all checks passed"

        echo "  - Lint     : OK"

        echo "  - Security : OK"

        echo "  - Validate : OK"

        echo "  - Structure: OK"

        echo "============================================"

        echo "Layout: infra/{terraform,pulumi}/{modules,packages}/{aws,azure}"

        echo "Modules and packages are ready for consumption."

        echo "To release, update VERSION and run the release workflow."

        '
