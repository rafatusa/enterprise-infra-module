name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Install tflint
      run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh
        | bash
    - name: tflint init
      run: tflint --init --config="$(pwd)/.tflint.hcl"
    - name: Terraform format check
      run: terraform fmt -check -recursive infra/modules/
    - name: Lint AWS modules
      run: "for dir in infra/modules/aws/*/; do\n  echo \"Linting $dir\"\n  tflint\
        \ --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
    - name: Lint Azure modules
      run: "for dir in infra/modules/azure/*/; do\n  echo \"Linting $dir\"\n  tflint\
        \ --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install checkov
      run: pip install checkov
    - name: Checkov AWS modules
      run: checkov -d infra/modules/aws --soft-fail
    - name: Checkov Azure modules
      run: checkov -d infra/modules/azure --soft-fail
    - name: Install tfsec
      run: 'wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64

        chmod +x /usr/local/bin/tfsec

        '
    - name: tfsec modules
      run: tfsec infra/modules --soft-fail
  provision:
    runs-on: ubuntu-latest
    needs:
    - lint
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Terraform Init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform Plan
      run: terraform plan -input=false
      working-directory: infra
    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - id: get_ip
      name: Get instance IP
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ip=$(terraform output -raw instance_public_ip)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Install Ansible
      run: pip install ansible
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ steps.get_ip.outputs.ip }}
    - name: Run Ansible playbook
      run: "ansible-playbook -i \"$HOST,\" \\\n  --private-key ~/.ssh/deploy_key \\\
        \n  -u ${{ secrets.SSH_USER }} \\\n  ansible/playbook.yml\n"
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Check module structure
      run: "echo \"=== AWS modules ===\"\nfor mod in infra/modules/aws/*/; do\n  [\
        \ -f \"${mod}main.tf\" ]      && echo \"OK ${mod}main.tf\"      || (echo \"\
        MISSING ${mod}main.tf\" && exit 1)\n  [ -f \"${mod}variables.tf\" ] && echo\
        \ \"OK ${mod}variables.tf\" || (echo \"MISSING ${mod}variables.tf\" && exit\
        \ 1)\n  [ -f \"${mod}outputs.tf\" ]   && echo \"OK ${mod}outputs.tf\"   ||\
        \ (echo \"MISSING ${mod}outputs.tf\" && exit 1)\ndone\necho \"=== Azure modules\
        \ ===\"\nfor mod in infra/modules/azure/*/; do\n  [ -f \"${mod}main.tf\" ]\
        \      && echo \"OK ${mod}main.tf\"      || (echo \"MISSING ${mod}main.tf\"\
        \ && exit 1)\n  [ -f \"${mod}variables.tf\" ] && echo \"OK ${mod}variables.tf\"\
        \ || (echo \"MISSING ${mod}variables.tf\" && exit 1)\n  [ -f \"${mod}outputs.tf\"\
        \ ]   && echo \"OK ${mod}outputs.tf\"   || (echo \"MISSING ${mod}outputs.tf\"\
        \ && exit 1)\ndone\n"
    - id: get_ip
      name: Get instance IP
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"ip=$(terraform output -raw instance_public_ip)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ steps.get_ip.outputs.ip }}
    - name: SSH connectivity check
      run: "ssh -i ~/.ssh/deploy_key \\\n  -o StrictHostKeyChecking=no \\\n  -o ConnectTimeout=10\
        \ \\\n  ${{ secrets.SSH_USER }}@$HOST \\\n  \"echo 'SSH OK' && uptime\"\n"
      env:
        HOST: ${{ steps.get_ip.outputs.ip }}
