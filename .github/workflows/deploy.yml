# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Install tflint
      run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh
        | bash
    - name: Terraform format check
      run: terraform fmt -check -recursive infra/modules/
    - name: tflint init
      run: tflint --init --config="$(pwd)/.tflint.hcl"
    - name: Lint AWS modules
      run: "for dir in infra/modules/aws/*/; do\n  echo \"==> Linting $dir\"\n  tflint\
        \ --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
    - name: Lint Azure modules
      run: "for dir in infra/modules/azure/*/; do\n  echo \"==> Linting $dir\"\n \
        \ tflint --chdir=\"$dir\" --config=\"$(pwd)/.tflint.hcl\"\ndone\n"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install checkov
      run: pip install checkov
    - name: Checkov AWS modules
      run: checkov -d infra/modules/aws --soft-fail
    - name: Checkov Azure modules
      run: checkov -d infra/modules/azure --soft-fail
    - name: Install tfsec
      run: 'wget -q -O /usr/local/bin/tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.11/tfsec-linux-amd64

        chmod +x /usr/local/bin/tfsec

        '
    - name: tfsec modules
      run: tfsec infra/modules --soft-fail
  validate:
    runs-on: ubuntu-latest
    needs:
    - lint
    - security
    env:
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
    - name: Terraform init (no backend - validation only)
      run: terraform init -backend=false -input=false
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
  docs-check:
    runs-on: ubuntu-latest
    needs:
    - validate
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Verify module file structure
      run: "missing=0\nfor mod in infra/modules/aws/*/ infra/modules/azure/*/; do\n\
        \  [ -d \"$mod\" ] || continue\n  for f in main.tf variables.tf outputs.tf\
        \ README.md; do\n    if [ ! -f \"${mod}${f}\" ]; then\n      echo \"MISSING:\
        \ ${mod}${f}\"\n      missing=1\n    fi\n  done\ndone\nif [ \"$missing\" -eq\
        \ 1 ]; then\n  echo \"One or more required module files are missing.\"\n \
        \ exit 1\nfi\necho \"All modules have main.tf, variables.tf, outputs.tf, and\
        \ README.md.\"\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - docs-check
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: All checks passed
      run: 'echo "============================================"

        echo " enterprise-infra-module: all checks passed"

        echo "  - Lint    : OK"

        echo "  - Security: OK"

        echo "  - Validate: OK"

        echo "  - Docs    : OK"

        echo "============================================"

        echo "Modules are ready for consumption."

        echo "To release a new version, update the VERSION"

        echo "file and trigger the release workflow."

        '
