name: release
'on':
  workflow_dispatch: {}
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - id: read_version
      name: Read VERSION
      run: 'VERSION=$(cat VERSION)

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        echo "Releasing v${VERSION}"

        '
    - name: Check tag does not already exist
      run: "VERSION=$(cat VERSION)\nif git ls-remote --tags origin \"refs/tags/v${VERSION}\"\
        \ | grep -q \"v${VERSION}\"; then\n  echo \"ERROR: Tag v${VERSION} already\
        \ exists.\"\n  echo \"Bump the VERSION file and re-trigger this workflow.\"\
        \n  exit 1\nfi\necho \"Tag v${VERSION} is new. Proceeding.\"\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git identity
      run: 'git config user.name "github-actions[bot]"

        git config user.email "github-actions[bot]@users.noreply.github.com"

        '
    - name: Create and push annotated tag
      run: 'VERSION=$(cat VERSION)

        git tag -a "v${VERSION}" -m "Release v${VERSION}"

        git push origin "v${VERSION}"

        '
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create GitHub Release
      run: "VERSION=$(cat VERSION)\ngh release create \"v${VERSION}\" \\\n  --title\
        \ \"v${VERSION}\" \\\n  --generate-notes \\\n  --latest\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
